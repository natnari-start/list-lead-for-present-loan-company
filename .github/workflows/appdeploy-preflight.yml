name: AppDeploy preflight

on:
  push:
    branches:
      - feature/appdeploy-source-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run pre-Live checks
        run: npm run verify:prelive
